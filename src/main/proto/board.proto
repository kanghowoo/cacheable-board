syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_package = "com.mide.gangsaeng";
option java_outer_classname = "BoardProto";

message BoardCreateFailedMessage {
  string title = 1;
  string content = 2;
  int64 userId = 3;
  google.protobuf.Timestamp created_at = 4;
}

message BoardUpdateFailedMessage {
  string title = 1;
  string content = 2;
  int64 userId = 3;
  google.protobuf.Timestamp updated_at = 4;
}
